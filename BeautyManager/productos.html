<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos | BeautyManager</title>

    <link rel="stylesheet" href="css/style.css">

    <script>
        const bmTema = localStorage.getItem("beautymanager-tema") || "morado";
        document.documentElement.setAttribute("data-tema", bmTema);
    </script>

    <script>
        if (localStorage.getItem("beautymanager-modo") === "oscuro") {
            document.documentElement.classList.add("modo-oscuro");
        }
    </script>

</head>

<body>

    <div class="app">

        <aside class="sidebar">
            <div class="logo">
                BeautyManager
            </div>

            <nav>
                <a href="dashboard.html" class="menu-item ">🏠 Inicio</a>
                <a href="productos.html" class="menu-item active">📦 Productos</a>
                <a href="clientes.html" class="menu-item ">👥 Clientes</a>
                <a href="pedidos.html" class="menu-item ">🛍️ Pedidos</a>
                <a href="ventas.html" class="menu-item ">💰 Ventas</a>
                <a href="estadisticas.html" class="menu-item ">📊 Estadísticas</a>
                <a href="configuracion.html" class="menu-item ">⚙️ Configuración</a>
            </nav>

            <div class="sidebar-bottom">
                <button id="cerrarSesion" class="logout" type="button">🚪 Cerrar sesión</button>
            </div>
        </aside>


        <main class="productos-page">

        <!-- ENCABEZADO -->
        <div class="pagina-header">

            <div>
                <h1>Mis productos 💄</h1>
                <p>Administra el inventario de tu emprendimiento.</p>
            </div>

            <button id="cerrarSesion" class="btn-secundario">
                Cerrar sesión
            </button>

        </div>

        <!-- AGREGAR PRODUCTO -->
        <section class="card">

            <h2>Agregar producto</h2>

            <form id="productoForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="nombreProducto">
                            Nombre del producto
                        </label>

                        <input
                            type="text"
                            id="nombreProducto"
                            placeholder="Ej: Gloss"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="categoriaProducto">
                            Categoría
                        </label>

                        <select id="categoriaProducto" required>

                            <option value="">
                                Selecciona una categoría
                            </option>

                            <option value="Labios">
                                Labios
                            </option>

                            <option value="Rostro">
                                Rostro
                            </option>

                            <option value="Ojos">
                                Ojos
                            </option>

                            <option value="Skincare">
                                Skincare
                            </option>

                            <option value="Cabello">
                                Cabello
                            </option>

                            <option value="Otros">
                                Otros
                            </option>

                        </select>
                    </div>


                    <div class="form-group">

                        <label for="precioProducto">
                            Precio
                        </label>

                        <input
                            type="number"
                            id="precioProducto"
                            placeholder="Ej: 25000"
                            min="0"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="stockProducto">
                            Stock
                        </label>

                        <input
                            type="number"
                            id="stockProducto"
                            placeholder="Ej: 10"
                            min="0"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn-principal"
                >
                    + Guardar producto
                </button>

            </form>


            <p id="productoMensaje"></p>

        </section>


        <!-- LISTA DE PRODUCTOS -->
        <section class="card">

            <div class="lista-header">

                <div>
                    <h2>Mis productos</h2>
                    <p>Consulta y administra tus productos.</p>
                </div>

                <input
                    type="text"
                    id="buscarProducto"
                    class="buscador"
                    placeholder="🔎 Buscar producto..."
                >

            </div>


            <div id="listaProductos">

                Cargando productos...

            </div>

        </section>

    </main>

    </div>


    <!-- MODAL PARA EDITAR -->
    <div
        id="modalEditar"
        class="modal"
        style="display: none;"
    >

        <div class="modal-contenido">

            <div class="modal-header">

                <h2>Editar producto ✏️</h2>

                <button
                    id="cerrarModal"
                    class="cerrar-modal"
                    type="button"
                >
                    ×
                </button>

            </div>


            <form id="editarForm">

                <input
                    type="hidden"
                    id="editarId"
                >


                <div class="form-group">

                    <label for="editarNombre">
                        Nombre del producto
                    </label>

                    <input
                        type="text"
                        id="editarNombre"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="editarCategoria">
                        Categoría
                    </label>

                    <select
                        id="editarCategoria"
                        required
                    >

                        <option value="Labios">
                            Labios
                        </option>

                        <option value="Rostro">
                            Rostro
                        </option>

                        <option value="Ojos">
                            Ojos
                        </option>

                        <option value="Skincare">
                            Skincare
                        </option>

                        <option value="Cabello">
                            Cabello
                        </option>

                        <option value="Otros">
                            Otros
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="editarPrecio">
                        Precio
                    </label>

                    <input
                        type="number"
                        id="editarPrecio"
                        min="0"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="editarStock">
                        Stock
                    </label>

                    <input
                        type="number"
                        id="editarStock"
                        min="0"
                        required
                    >

                </div>


                <div class="modal-botones">

                    <button
                        type="button"
                        id="cancelarEdicion"
                        class="btn-secundario"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn-principal"
                    >
                        Guardar cambios
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script
        type="module"
        src="js/productos.js"
    ></script>

    <script src="js/tema.js"></script>

</body>

</html>
